name: Build exe release

# The exe freezes yt-dlp at build time and YouTube changes often, so rebuild
# every week; a scheduled run only publishes when yt-dlp or the code changed.
on:
  schedule:
    - cron: "0 0 * * 1" # Mondays 00:00 UTC (09:00 KST)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.py"
      - "diagnose.py"
      - "paths.py"
      - "public/**"
      - "requirements.txt"
      - "build_exe.py"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install yt-dlp and PyInstaller
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Decide whether to publish
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python -c "import yt_dlp; print(yt_dlp.version.__version__)")
          marker="yt-dlp ${ver} / commit ${GITHUB_SHA::7}"
          echo "ytdlp=${ver}" >> "$GITHUB_OUTPUT"
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"
          last=$(gh release view --json body -q .body 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -qF "$marker" <<< "$last"; then
            echo "Latest release already has ${marker}; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch LGPL ffmpeg
        if: steps.decide.outputs.skip == 'false'
        shell: bash
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -q ffmpeg.zip -d ffmpeg-dist
          cp ffmpeg-dist/*/bin/ffmpeg.exe ffmpeg.exe
          ./ffmpeg.exe -hide_banner -version | head -1
          # MP3 mode needs the LAME encoder; fail the build rather than ship a broken MP3 mode.
          ./ffmpeg.exe -hide_banner -encoders | grep -q libmp3lame

      - name: Build exe
        if: steps.decide.outputs.skip == 'false'
        run: python build_exe.py --ffmpeg ffmpeg.exe

      - name: Smoke test
        if: steps.decide.outputs.skip == 'false'
        run: dist\YTDownloader.exe --check

      - name: Publish release
        if: steps.decide.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          교육용 · 로컬 전용 유튜브 다운로더 (Windows)

          1. 아래 **YTDownloader.exe**를 받아 원하는 폴더에 둡니다.
          2. 더블클릭하면 검은 창이 뜨고 브라우저에서 http://127.0.0.1:8765 이 열립니다.
          3. "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.

          ⚠ 교육용 목적에 한해, 이용 권한이 있는 콘텐츠만 받으세요. 재배포·상업적 이용 금지.

          ffmpeg(LGPL, BtbN/FFmpeg-Builds) 포함. 라이선스는 THIRD_PARTY_NOTICES.md 참고.

          build: ${{ steps.decide.outputs.marker }}
          EOF
          gh release create "$tag" dist/YTDownloader.exe THIRD_PARTY_NOTICES.md \
            --title "YTDownloader ${tag} (yt-dlp ${{ steps.decide.outputs.ytdlp }})" \
            --notes-file notes.md --latest
